<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chatbot para Psicología</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Bootstrap CSS -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Fuente de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Firebase App (el SDK principal) siempre es necesario y debe ser listado primero -->
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js"></script>
    <!-- Añade los productos de Firebase que quieras usar -->
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@2.3.10/dist/purify.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/dompurify@2.4.3/dist/purify.min.js"></script>
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Bootstrap JS -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <style>
        .auth-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        .auth-buttons button {
            margin: 5px;
            padding: 10px;
            background-color: #ffffff;
            color: #6C63FF;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <header style="background-color: #6C63FF; color: white; padding: 20px;">
        <div class="d-flex justify-content-between align-items-center">
            <!-- Título a la izquierda -->
            <h1 style="margin: 0;">Chatbot para Psicología Inicial</h1>
            
            <!-- Menús de autenticación a la derecha -->
            <div class="auth-buttons">
                <button onclick="window.location.href='home.html'">Inicio</button>
                <span id="usernameDisplay" style="color: white; margin-right: 10px; display: none;"></span>
                <button id="loginBtn">Login</button>
                <button id="registerBtn">Registro</button>
                <button id="logoutBtn" style="display: none;">Logout</button>
            </div>
        </div>
    </header>
    
    <main class="container-fluid mt-4">

         <!-- Modal de Login -->
<div id="loginModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Iniciar Sesión</h2>
        <div class="input-group">
            <label for="login-usuario">Usuario</label>
            <input type="text" id="login-usuario" placeholder="Ingresa tu usuario">
        </div>
        <div class="input-group">
            <label for="login-contraseña">Contraseña</label>
            <input type="password" id="login-contraseña" placeholder="Ingresa tu contraseña">
        </div>
        <button onclick="login()">Ingresar</button>
    </div>
</div>

<!-- Modal de Registro -->
<div id="registerModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Registro</h2>
        <div class="input-group">
            <label for="register-usuario">Usuario</label>
            <input type="text" id="register-usuario" placeholder="Crea un usuario">
        </div>
        <div class="input-group">
            <label for="register-contraseña">Contraseña</label>
            <input type="password" id="register-contraseña" placeholder="Crea una contraseña">
        </div>
        <button onclick="register()">Registrarse</button>
    </div>
</div>


        <!-- Contenedor del Chat -->
        <div id="chat-container" class="card mx-auto" style="max-width: 700px;">
            <div id="chat-box" class="card-body overflow-auto" style="height: 400px;">
                <ul id="messages" class="list-unstyled mb-0"></ul>
            </div>
            <div id="input-container" class="card-footer d-flex flex-column flex-md-row">
                <input type="text" id="user-input" class="form-control mb-2 mb-md-0 mr-md-2" placeholder="Escribe algo aquí..." />
                <button id="send-button" class="btn btn-primary mr-md-2"><i class="material-icons">send</i></button>
                <button id="diagnostic-button" class="btn btn-secondary"><i class="material-icons">assessment</i></button>
            </div>
        </div>
    </main>
    <footer style="background-color: #6C63FF; color: white; text-align: center; padding: 10px 0;">
        <p style="margin: 0;">&copy; 2024 Chatbot para Psicología. Todos los derechos reservados.</p>
    </footer>

    <!-- Tu script personalizado -->
    <script type="module" src="auth.js"></script>
    <script type="module" src="chatbot.js"></script>
</body>
</html>
