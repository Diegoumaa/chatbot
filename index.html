<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chatbot para Psicología</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Fuente de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Firebase App (el SDK principal) siempre es necesario y debe ser listado primero -->
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js"></script>
    <!-- Añade los productos de Firebase que quieras usar -->
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@2.3.10/dist/purify.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

</head>
<body>

    <header>
        <h1>Chatbot para Psicología Inicial</h1>
        <div class="auth-buttons">
            <button onclick="window.location.href='home.html'">Inicio</button>
            <span id="usernameDisplay" style="color: white; margin-right: 10px; display: none;"></span>
            <button id="loginBtn">Login</button>
            <button id="registerBtn">Registro</button>
            <button id="logoutBtn" style="display: none;">Logout</button>
        </div>
    </header>
    
    <main>
     <!-- Modal de Login -->
<div id="loginModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Iniciar Sesión</h2>
        <div class="input-group">
            <label for="login-usuario">Usuario</label>
            <input type="text" id="login-usuario" placeholder="Ingresa tu usuario">
        </div>
        <div class="input-group">
            <label for="login-contraseña">Contraseña</label>
            <input type="password" id="login-contraseña" placeholder="Ingresa tu contraseña">
        </div>
        <button onclick="login()">Ingresar</button>
    </div>
</div>

<!-- Modal de Registro -->
<div id="registerModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Registro</h2>
        <div class="input-group">
            <label for="register-usuario">Usuario</label>
            <input type="text" id="register-usuario" placeholder="Crea un usuario">
        </div>
        <div class="input-group">
            <label for="register-contraseña">Contraseña</label>
            <input type="password" id="register-contraseña" placeholder="Crea una contraseña">
        </div>
        <button onclick="register()">Registrarse</button>
    </div>
</div>

        <!-- Contenedor del Chat -->
        <div id="chat-container">
            <div id="chat-box">
                <ul id="messages"></ul>
            </div>
            <div id="input-container">
                <input type="text" id="user-input" placeholder="Escribe algo aquí..." />
                <button id="send-button"><i class="material-icons">send</i></button>
                <button id="diagnostic-button"><i class="material-icons">assessment</i></button>
                
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 Chatbot para Psicología. Todos los derechos reservados.</p>
    </footer>

    <!-- Tu script personalizado -->
    <script type="module" src="auth.js"></script>
    <script type="module" src="chatbot.js"></script>
    
</body>
</html>
